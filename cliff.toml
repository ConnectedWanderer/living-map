[remote.github]
owner = "ConnectedWanderer"
repo = "living-map"

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7) }})
{% endfor %}
{% endfor %}
"""
trim = true
postprocessors = [{ pattern = "\\[skip ci\\]", replace = "" }]

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = ".*", group = "Other" },
]
